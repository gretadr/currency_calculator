services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: currency_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: greta0404
      POSTGRES_DB: currency_calculator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: currency_backend
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_DATABASE: currency_calculator
      DB_PASSWORD: greta0404
      DB_PORT: 5432
      PORT: 5000
      ACCESS_TOKEN_SECRET: 87825d586eb368a74d2960dab01cf001a02656036e8df415883427de47265e4fa5e1a95e1158b55128bd454b672e3096267912619dee91337980fb54f847bbc8
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (Vue + Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: currency_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: